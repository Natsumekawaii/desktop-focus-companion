name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (never moved or overwritten)
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
              throw 'Expected an existing vMAJOR.MINOR.PATCH tag.'
          }

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Record immutable source revision
        id: source
        shell: pwsh
        run: |
          $revision = (git rev-parse HEAD).Trim()
          $tagRevision = (git rev-parse "$($env:RELEASE_TAG)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $revision -ne $tagRevision) {
              throw 'Checkout does not match the requested release tag.'
          }
          "revision=$revision" >> $env:GITHUB_OUTPUT

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-build.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements-dev.txt -r requirements-build.txt

      - name: Install verified Inno Setup from its official release
        shell: pwsh
        run: |
          $version = (Get-Content toolchain.json | ConvertFrom-Json).inno_setup
          if ($version -ne '6.7.3') { throw 'Update the compiler checksum before changing versions.' }
          # Matches the upstream release digest and Microsoft's winget manifest.
          $expectedHash = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer -TimeoutSec 120
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedHash) {
              throw 'Inno Setup download checksum mismatch.'
          }
          $compilerRoot = Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6'
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=`"$compilerRoot`"") -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(120000)) {
              $process.Kill()
              throw 'Inno Setup installation timed out.'
          }
          if ($process.ExitCode -ne 0) { throw "Inno Setup failed: $($process.ExitCode)" }
          if (-not (Test-Path (Join-Path $compilerRoot 'ISCC.exe'))) { throw 'Compiler not found.' }
          $compilerRoot >> $env:GITHUB_PATH

      - name: Verify versions, dependencies and bilingual notes before building
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m scripts.build_support preflight --tag $env:RELEASE_TAG --compiler auto

      - name: Run quality gate
        shell: pwsh
        run: .\quality.ps1

      - name: Build and smoke-test installer
        shell: pwsh
        run: .\build-installer.ps1 -ReleaseBuild

      - name: Prepare release assets
        id: assets
        shell: pwsh
        run: |
          $version = (.\.venv\Scripts\python.exe -c "from app import __version__; print(__version__)").Trim()
          $releaseRoot = Join-Path $PWD 'dist\release'
          New-Item -ItemType Directory -Path $releaseRoot -Force | Out-Null

          $installer = Join-Path $PWD "dist\installer\DesktopFocusCompanion-Setup-$version.exe"
          $portable = Join-Path $releaseRoot "DesktopFocusCompanion-Portable-$version.zip"
          $checksum = Join-Path $releaseRoot 'SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
              throw "Installer was not created: $installer"
          }

          Compress-Archive `
              -Path (Join-Path $PWD 'dist\DesktopFocusCompanion') `
              -DestinationPath $portable `
              -CompressionLevel Optimal

          $assets = @($installer, $portable)
          $lines = foreach ($asset in $assets) {
              $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $([System.IO.Path]::GetFileName($asset))"
          }
          Set-Content -LiteralPath $checksum -Value $lines -Encoding utf8

          "installer=$installer" >> $env:GITHUB_OUTPUT
          "portable=$portable" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release without replacing existing assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REVISION: ${{ steps.source.outputs.revision }}
          INSTALLER_ASSET: ${{ steps.assets.outputs.installer }}
          PORTABLE_ASSET: ${{ steps.assets.outputs.portable }}
          CHECKSUM_ASSET: ${{ steps.assets.outputs.checksum }}
        run: |
          .\.venv\Scripts\python.exe -m scripts.publish_release $env:RELEASE_TAG $env:RELEASE_REPOSITORY $env:RELEASE_REVISION $env:INSTALLER_ASSET $env:PORTABLE_ASSET $env:CHECKSUM_ASSET

      - name: Preserve failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics
          path: |
            artifacts/quality/
            build/installer-smoke/*.log
            build/packaged-smoke-profile/
          retention-days: 14
