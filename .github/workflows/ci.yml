name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Windows quality gate
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Classify changed files (unknown means full)
        id: scope
        shell: pwsh
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $mode = (.\.venv\Scripts\python.exe -m scripts.ci_scope --base "$env:BASE_REVISION" --head "$env:HEAD_REVISION").Trim()
          "mode=$mode" >> $env:GITHUB_OUTPUT

      - name: Ruff
        shell: pwsh
        run: .\quality.ps1 -Stage Ruff

      - name: mypy
        shell: pwsh
        run: .\quality.ps1 -Stage Mypy

      - name: pytest
        shell: pwsh
        env:
          QUALITY_MODE: ${{ steps.scope.outputs.mode }}
        run: .\quality.ps1 -Stage Tests -Mode $env:QUALITY_MODE

      - name: Preserve quality diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: artifacts/quality/
          retention-days: 14
