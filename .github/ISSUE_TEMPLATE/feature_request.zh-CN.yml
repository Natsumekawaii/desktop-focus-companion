name: 功能建议
description: 提出聚焦的改进建议，并说明用户需求。
title: "[功能]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        [English](https://github.com/Natsumekawaii/desktop-focus-companion/issues/new?template=feature_request.yml) | [简体中文](https://github.com/Natsumekawaii/desktop-focus-companion/issues/new?template=feature_request.zh-CN.yml)
  - type: textarea
    id: problem
    attributes:
      label: 用户需求
      description: 这项功能希望解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望体验
      description: 请描述期望行为，而不只是实现方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你尝试或考虑过哪些办法？
  - type: checkboxes
    id: boundaries
    attributes:
      label: 产品边界
      options:
        - label: 此建议可以保留本地优先存储并兼容现有用户数据。
          required: true
