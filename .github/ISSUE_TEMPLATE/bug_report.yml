name: Bug report / 错误报告
description: Report a reproducible problem without including private Focus data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Desktop Focus Companion. 请勿上传真实数据库、设置文件或包含隐私的截图。
  - type: input
    id: version
    attributes:
      label: Version / 版本
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: install-type
    attributes:
      label: Installation / 安装方式
      options:
        - Installer / 安装版
        - Portable / 便携版
        - Source / 源码运行
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version / Windows 版本
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened? / 问题描述
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      placeholder: |
        1. Open ...
        2. Choose ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context / 补充信息
      description: Remove names, notes, file paths, and other private data before attaching logs or screenshots.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Checklist / 检查清单
      options:
        - label: I searched existing issues. / 我已搜索现有 Issue。
          required: true
        - label: I removed private Focus data from attachments. / 附件中不含私人专注数据。
          required: true
