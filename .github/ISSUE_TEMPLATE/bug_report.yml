name: Bug report
description: Report a reproducible problem without including private Focus data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        [English](https://github.com/Natsumekawaii/desktop-focus-companion/issues/new?template=bug_report.yml) | [简体中文](https://github.com/Natsumekawaii/desktop-focus-companion/issues/new?template=bug_report.zh-CN.yml)

        Thanks for helping improve Desktop Focus Companion. Do not upload real databases, settings files, or screenshots containing private data.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.0.1"
    validations:
      required: true
  - type: dropdown
    id: install-type
    attributes:
      label: Installation
      options:
        - Installer
        - Portable
        - Source
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Choose ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Remove names, notes, file paths, and other private data before attaching logs or screenshots.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed private Focus data from attachments.
          required: true
